  <template id="ps-t-main" data-title="Мониторинг оборудования" data-w="700">
    <h3>Система мониторинга оборудования</h3>
    <p class="ps-lead">Корпоративная система для заказчика ООО "Компания Дизель". Началась как выпускная работа, сейчас развивается как рабочий проект для реального заказчика.</p>
    <p>Система опрашивает промышленные контроллеры, замечает отклонения и сразу сообщает людям. Всё, от сбора требований до документации, я делаю сама.</p>
    <h4>Как это устроено</h4>
    <div class="ps-flow">
      <span>Контроллеры</span><em>→</em><span>Сбор данных по IP</span><em>→</em><span>Своя БД</span><em>→</em><span class="hot">Фильтры и пороги</span><em>→</em><span>Telegram</span><em>·</em><span>Яндекс Мессенджер</span><em>·</em><span>Веб-кабинет</span>
    </div>
    <h4>Как выглядит интерфейс</h4>
    <div class="ps-shots"></div>
    <h4>Что сделано</h4>
    <ul>
      <li>Собрала требования, спроектировала архитектуру, разработала систему full-stack</li>
      <li>Сбор данных с контроллеров по IP, запись в собственную базу данных</li>
      <li>Фильтрация показаний и уведомления по порогам в Telegram, Яндекс Мессенджер и на веб-платформу</li>
      <li>Веб-кабинет: роли (администратор и обычный пользователь), графики, фильтры, выгрузка отчётов в Excel и Word</li>
      <li>LLM-ассистент по базе знаний компании (RAG) для консультаций сотрудников</li>
      <li>Техническая документация</li>
    </ul>
    <h4>Что делаю сейчас</h4>
    <ul>
      <li>Превращаю решение в универсальное: цель — 1000+ установок, у каждой своя конфигурация регистров и свои пороги</li>
      <li>Перерабатываю схему данных и перехожу на PostgreSQL, пишу загрузку файлов конфигураций</li>
      <li>Готовлю предиктивную аналитику: прогноз неисправностей и времени до техобслуживания</li>
    </ul>

      <li>Настроила LlamaIndex для оркестрации запросов к LLM</li>
      <li>Использовала ChromaDB как векторное хранилище, сделала агента с промптами</li>

         youtube:'ID_ролика'               ролик на YouTube (только ID из ссылки)
         src вместе с video/youtube        своя обложка для видео
         cap:'Подпись'                     подпись под превью
         phone:true                        вертикальный кадр (для роликов и экранов телефона)
       Пустой список [] = в окне только текст. */
    photo:'',                  // фото для окна «Обо мне», 'assets/photo/me.jpg'
    media:{
      main:[
        {src:'assets/main/Main1.jpg', cap:'Веб-кабинет'},
        {src:'assets/main/ShemaLLM.png', cap:'Архитектура проекта'},
        {src:'assets/main/Main2.jpg', cap:'Уведомления Веб-кабинет'},
        {src:'assets/main/Main3.jpg', cap:'Уведомления Яндекс Мессенджер'},
      ],
      rag:[
        {src:'assets/rag/LLM.png', cap:'Архитектура системы'},
        {src:'assets/rag/LLMAI.png', cap:'Интерфейс системы'},
        {src:'assets/rag/SystemLLm.png', cap:'Схема агента'},
      ],
      cv:[
        {src:'assets/cv/CV1.png', cap:'Детекция и подсчёт'},
        {video:'assets/video/processed_result.mp4', cap:'Демонстрация работы модуля фильтрации и подсчёта объектов', phone:false},
      ],
      app:[
        {src:'assets/app/App1.png', cap:'Главный экран', phone:true},
        {src:'assets/app/App2.png', cap:'Карточки слов', phone:true},
        {src:'assets/app/App3.png', cap:'Прогресс', phone:true},
      ],
      web:[
        // {src:'assets/web/standuppoint.jpg', cap:'StandupPoint.ru'},
      ],
      pubs:[
        // {src:'assets/pubs/diploma.jpg', cap:'Диплом конференции'},
      ]
    },
  };
  /* ==================================================== */

  var root=document.getElementById('psRoot'); if(!root)return;
  var layer=document.getElementById('psWindows');
  var wins={}, z=20;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ---- часы ---- */
  function clock(){
    var d=new Date(), h=('0'+d.getHours()).slice(-2), m=('0'+d.getMinutes()).slice(-2);
    var el=document.getElementById('psClock'); if(el) el.textContent=h+':'+m;
  }
  clock(); setInterval(clock,20000);

  /* ---- окна ---- */
  function mark(id,on){
    root.querySelectorAll('.ps-dock [data-open="'+id+'"]').forEach(function(b){b.classList.toggle('on',on)});
  }
  function focusWin(w){ w.style.zIndex=++z; }

  function typeTerm(body){
    var lines=body.querySelectorAll('.ps-tl'), i=0;
    if(reduce){lines.forEach(function(l){l.classList.add('on')});return;}
    (function next(){ if(i>=lines.length)return; lines[i++].classList.add('on'); setTimeout(next,i%3===0?380:240); })();
  }

  /* ---- фото, скриншоты, видео ---- */
  var lb=document.getElementById('psLb'), lbBox=document.getElementById('psLbBox');
  function closeLb(){ lb.classList.remove('on'); lbBox.innerHTML=''; }
  lb.addEventListener('click',function(e){ if(e.target===lb||e.target.tagName==='BUTTON') closeLb(); });
  function openLb(src,video,phone){
    lbBox.innerHTML='';
    var el, link=null;
    if(video){
      if(isFile(video)){ el=document.createElement('video'); el.src=video; el.controls=true; el.autoplay=true; el.playsInline=true; }
      else {
        el=document.createElement('iframe'); el.src=video; el.allowFullscreen=true;
        el.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
        el.setAttribute('allow','autoplay; fullscreen; encrypted-media');
        if(phone){ el.style.width='auto'; el.style.height='min(86vh,780px)'; el.style.aspectRatio='9/16'; }
        var m=video.match(/youtube\.com\/embed\/([\w-]+)/);
        if(m){ link=document.createElement('a'); link.className='ps-lb-link'; link.href='https://www.youtube.com/watch?v='+m[1]; link.target='_blank'; link.rel='noopener'; link.textContent='Не открывается? Смотреть на YouTube ↗'; }
      }
    } else { el=document.createElement('img'); el.src=src; el.alt=''; }
    lbBox.appendChild(el); if(link) lbBox.appendChild(link); lb.classList.add('on');
  }
  function isFile(u){ return /\.(mp4|webm|mov)(\?|#|$)/i.test(u||''); }
  function buildMedia(body,id){
    if(id==='about'&&PS_CONFIG.photo){
      var av=body.querySelector('.ps-avatar'); if(av) av.setAttribute('data-src',PS_CONFIG.photo);
    }
    var items=(PS_CONFIG.media||{})[id]; if(!items||!items.length)return;
    var box=body.querySelector('.ps-shots');
    if(!box){
      box=document.createElement('div'); box.className='ps-shots';
      var lead=body.querySelector('.ps-lead'); if(lead) lead.after(box); else body.prepend(box);
    }
    box.innerHTML='';
    items.forEach(function(it){
      var f=document.createElement('figure'); f.className='ps-shot'+(it.phone?' phone':'');
      var vid=it.video||(it.youtube?'https://www.youtube.com/embed/'+it.youtube+'?autoplay=1&rel=0':'');
      var src=it.src||(it.youtube?'https://img.youtube.com/vi/'+it.youtube+'/maxresdefault.jpg':'');
      if(!it.src&&it.youtube) f.setAttribute('data-yt','1');
      f.setAttribute('data-src',src); f.setAttribute('data-video',vid); f.setAttribute('data-cap',it.cap||'');
      box.appendChild(f);
    });
  }
  function initShots(body){
    body.querySelectorAll('figure.ps-shot').forEach(function(f){
      var src=f.getAttribute('data-src'), vid=f.getAttribute('data-video'), cap=f.getAttribute('data-cap')||'';
      if(!src&&!vid){
        if(!PS_CONFIG.showEmpty){ f.remove(); return; }
        f.classList.add('empty'); f.textContent=cap?(cap):''; return;
      }
      if(src){ var img=document.createElement('img'); img.alt=cap; img.loading='lazy';
        if(f.hasAttribute('data-yt')){
          var toHq=function(){ if(/maxresdefault/.test(img.src)) img.src=img.src.replace('maxresdefault','hqdefault'); };
          img.onerror=toHq; img.onload=function(){ if(img.naturalWidth<=160) toHq(); };
          if(f.classList.contains('phone')){ img.style.aspectRatio='9/16'; img.style.objectFit='cover'; }
        } else {
          img.onerror=function(){
            if(img.dataset.tried) return; img.dataset.tried='1';
            img.src=img.src.replace(/\.(png|jpe?g)(\?.*)?$/i,function(m,e,q){ return (/png/i.test(e)?'.jpg':'.png')+(q||''); });
          };
        }
        img.src=src; f.appendChild(img); }
      else if(isFile(vid)){ var v=document.createElement('video'); v.src=vid+'#t=0.5'; v.preload='metadata'; v.muted=true; v.playsInline=true; f.appendChild(v); }
      else { f.classList.add('empty'); f.textContent='▶ '+cap; }
      if(vid) f.classList.add('vid');
      if(cap&&!f.hasAttribute('data-avatar')){ var c=document.createElement('figcaption'); c.textContent=cap; f.appendChild(c); }
      f.addEventListener('click',function(){ var shown=f.querySelector('img'); openLb((shown&&shown.src)||src,vid,f.classList.contains('phone')); });
    });
  }

  function openWin(id){
    if(wins[id]){ focusWin(wins[id]); return; }
    var tpl=document.getElementById('ps-t-'+id); if(!tpl)return;
    var title=tpl.getAttribute('data-title'), width=+tpl.getAttribute('data-w')||540, cls=tpl.getAttribute('data-class')||'';
    var w=document.createElement('section');
    w.className='ps-win '+cls; w.setAttribute('role','dialog'); w.setAttribute('aria-label',title);
    w.innerHTML='<div class="ps-bar"><span class="ps-dots"><button type="button" aria-label="Закрыть"></button><i></i><i></i></span><span class="ps-ttl"></span></div><div class="ps-body"></div>';
    w.querySelector('.ps-ttl').textContent=title;
    var body=w.querySelector('.ps-body'); body.appendChild(tpl.content.cloneNode(true));
    buildMedia(body,id);
    initShots(body);

    var n=Object.keys(wins).length, rw=root.clientWidth;
    width=Math.min(width,rw-16);
    var topPx=window.innerWidth<=720?46:58+n*26;
    w.style.width=width+'px';
    w.style.left=Math.max(8,Math.min(rw-width-8, 150+n*30))+'px';
    w.style.top=topPx+'px';
    w.style.maxHeight=Math.max(240,root.clientHeight-topPx-100)+'px';
    layer.appendChild(w); focusWin(w); wins[id]=w; mark(id,true);

    w.addEventListener('pointerdown',function(){focusWin(w)});
    w.querySelector('.ps-dots button').addEventListener('click',function(){ w.remove(); delete wins[id]; mark(id,false); });

    var bar=w.querySelector('.ps-bar'), sx,sy,ox,oy,drag=false;
    bar.addEventListener('pointerdown',function(e){
      if(e.target.closest('button')||window.innerWidth<=720)return;
      drag=true; sx=e.clientX; sy=e.clientY; ox=w.offsetLeft; oy=w.offsetTop; bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener('pointermove',function(e){
      if(!drag)return;
      var nx=ox+e.clientX-sx, ny=oy+e.clientY-sy;
      w.style.left=Math.max(-width+90,Math.min(root.clientWidth-90,nx))+'px';
      w.style.top=Math.max(40,Math.min(root.clientHeight-80,ny))+'px';
    });
    function end(){drag=false}
    bar.addEventListener('pointerup',end); bar.addEventListener('pointercancel',end);

    if(id==='skills') typeTerm(body);
  }

  root.addEventListener('click',function(e){
    var t=e.target.closest('[data-open]'); if(t) openWin(t.getAttribute('data-open'));
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(lb.classList.contains('on')){ closeLb(); return; }
    var top=null,tz=-1; Object.keys(wins).forEach(function(k){var v=+wins[k].style.zIndex||0; if(v>tz){tz=v;top=k}});
    if(top){ wins[top].remove(); delete wins[top]; mark(top,false); }
  });

  var pt=document.getElementById('psPortraitImg');
  if(pt){
    if(PS_CONFIG.portrait){ pt.onerror=function(){ pt.parentNode.style.display='none'; }; pt.src=PS_CONFIG.portrait; }
    else pt.parentNode.style.display='none';
  }

  if(window.innerWidth>=900) setTimeout(function(){openWin('about')},500);
})();
</script>
</body>
</html>
